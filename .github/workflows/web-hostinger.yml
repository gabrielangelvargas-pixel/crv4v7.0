# Compila la web y la publica en la rama "hostinger".
# Hostinger toma esa rama por Git (hPanel > Avanzado > Git) y la copia a public_html.
name: Web a Hostinger

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-hostinger.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      # Se agrega un commit nuevo (sin reescribir la historia) para que Hostinger pueda hacer "git pull".
      - name: Publicar en la rama hostinger
        working-directory: .
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO" hostinger > /dev/null; then
            git clone -q --depth 1 --branch hostinger "$REPO" salida
          else
            mkdir salida && git -C salida init -q -b hostinger && git -C salida remote add origin "$REPO"
          fi
          find salida -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a web/dist/. salida/
          cd salida
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Web ${GITHUB_SHA::7}"
          git push -q origin hostinger
